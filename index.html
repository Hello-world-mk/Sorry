<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smile新聞/Smile放送局</title>

<!-- Google Fonts: IBM Plex Sans JP -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'IBM Plex Sans JP', sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    marquee {
        font-family: 'IBM Plex Sans JP', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: white;
        background-color: #00a2ff;
    }

    h1 {
        font-size: 32px;
        font-weight: 700;
    }

    p {
        font-size: 16px;
        font-weight: 400;
    }

    a {
        display: inline-block;
        font-size: 18px;
        font-weight: 500;
    }
</style>
</head>

<body>

<!-- 接続できないときだけ表示 -->
<marquee id="connectionStatus" style="display: none;">
現在接続できません。
</marquee>

<h1>Smile新聞/Smile放送局</h1>

<p>
現在、Webサイトに接続ができません。<br>
新聞を見るには
</p>

<a href="https://hello-world-mk.github.io/SmileShinbun/">
こちら
</a>

<script>
async function checkConnection() {
    const status = document.getElementById("connectionStatus");

    if (!navigator.onLine) {
        status.style.display = "block";
        return;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 4000);

    try {
        await fetch("https://www.gstatic.com/generate_204", {
            method: "HEAD",
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal
        });

        status.style.display = "none";
    } catch (error) {
        status.style.display = "block";
    } finally {
        clearTimeout(timeout);
    }
}

// ページを開いたときに確認
checkConnection();

// 5秒ごとに再確認
setInterval(checkConnection, 5000);

// 接続状態が変化したら確認
window.addEventListener("online", checkConnection);
window.addEventListener("offline", checkConnection);
</script>

</body>
</html>
