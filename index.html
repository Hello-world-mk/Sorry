<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smile新聞/Smile放送局</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'IBM Plex Sans JP', sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    #connectionStatus {
        display: none;
        overflow: hidden;
        white-space: nowrap;
        color: white;
        background-color: #00a2ff;
        font-size: 24px;
        font-weight: 700;
        padding: 8px 0;
    }

    #connectionMessage {
        display: inline-block;
        padding-left: 100%;
        animation: scrollText 12s linear infinite;
    }

    @keyframes scrollText {
        from {
            transform: translateX(0);
        }
        to {
            transform: translateX(-100%);
        }
    }

    h1 {
        font-size: 32px;
        font-weight: 700;
    }

    p {
        font-size: 16px;
    }

    a {
        display: inline-block;
        font-size: 18px;
        font-weight: 500;
    }
</style>
</head>

<body>

<div id="connectionStatus">
    <span id="connectionMessage">現在接続できません。</span>
</div>

<h1>Smile新聞/Smile放送局</h1>

<p>
現在、Webサイトに接続ができません。<br>
新聞を見るには
</p>

<a href="https://hello-world-mk.github.io/SmileShinbun/">
こちら
</a>

<script>
const status = document.getElementById("connectionStatus");

async function checkConnection() {
    if (!navigator.onLine) {
        status.style.display = "block";
        return;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 4000);

    try {
        const response = await fetch(
            "https://www.gstatic.com/generate_204",
            {
                cache: "no-store",
                signal: controller.signal
            }
        );

        status.style.display =
            response.ok ? "none" : "block";
    } catch (error) {
        status.style.display = "block";
    } finally {
        clearTimeout(timeout);
    }
}

checkConnection();
setInterval(checkConnection, 5000);

window.addEventListener("online", checkConnection);
window.addEventListener("offline", checkConnection);
</script>

</body>
</html>
